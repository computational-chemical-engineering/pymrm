name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: python:3.10

    steps:
    - uses: actions/checkout@v4
    - name: Configure git safe.directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Test Install
      run: python -m pip install .
